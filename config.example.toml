# Copy to config.toml, then replace the example coordinates with YOUR location.
# Greenwich is a demonstration location, not a personal default.
[observer]
latitude = 51.4779
longitude = 0.0
elevation_m = 46.0
timezone = "Europe/London"

[service]
data_dir = "data"
interval_seconds = 300
recent_hours = 2
prediction_days = 7
retention_days = 90
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
bind_host = "127.0.0.1" # LAN: 0.0.0.0 plus lan_access=true and exact private hosts.
port = 8008
lan_access = false
trusted_proxy_ips = [] # Exact private proxy IPs only; default ignores forwarding.

# General Pi Camera / Timelapse (Camera Module 3), separate from future ZWO imaging.
# Enable only after the Pi's apt Picamera2/rpicam diagnostics pass.
[camera]
enabled = false
backend = "picamera2"
camera_index = 0
capture_directory = "camera/stills" # Relative to service.data_dir, must stay below it.
preview_enabled = true
preview_width = 640
preview_height = 480
preview_fps = 2 # 1–5; JPEG encoding only while a viewer is connected.

[camera.timelapse]
enabled = false # Start on service startup; Camera page Start/Stop is session-only.
interval_seconds = 60 # 10–604800; scheduled from completion, no catch-up bursts.
directory = "camera/timelapse" # Relative to service.data_dir.

[detectors.planetary]
enabled = true
interval_seconds = 3600 # Reuse geometry; atmosphere/policy still update every slow cycle.
bodies = ["Jupiter", "Saturn", "Mars"]
minimum_altitude_deg = 25
maximum_sun_altitude_deg = -6
aperture_mm = 203.2

# Dedicated phenomena complement the broad nightly planetary window.
# Older configs default this optional module off; enable in Settings or here.
[detectors.jupiter]
enabled = true
interval_seconds = 21600
horizon_days = 14 # Also capped by service.prediction_days; maximum 31.
minimum_altitude_deg = 30
maximum_sun_altitude_deg = -6
aperture_mm = 203.2 # 8-inch reflector; diffraction reference, not a resolution promise.
phenomena = ["transit", "shadow_transit", "eclipse", "occultation"]
include_overlaps = true
transition_window_minutes = 15
grs_enabled = true
grs_reference_utc = "2026-06-01T00:00:00Z"
grs_longitude_deg = 91.0
grs_drift_deg_per_month = 1.75 # Month = 30.4375 days; published extrapolation.
grs_reference_max_age_days = 180 # Moon events continue after GRS reference expires.
grs_window_minutes = 50 # Each side of central-meridian passage.
grs_source_url = "https://skyandtelescope.org/stargazing-and-observing/interactive-stargazing-tools/transit-times-of-jupiters-great-red-spot/"

[detectors.sunset]
enabled = true
interval_seconds = 86400

[detectors.eclipses]
enabled = true
horizon_days = 730 # Independent of the short planetary horizon.
interval_seconds = 21600
solar = true
lunar = true
penumbral = false
minimum_altitude_deg = 0 # Airless body center; terrain is not modeled.

[detectors.aurora]
enabled = true
interval_seconds = 300
minimum_intensity = 10 # Native NOAA proxy, not local visual probability.
minimum_horizon_elevation_deg = 0
maximum_sun_altitude_deg = -6
emission_height_min_km = 110
emission_height_max_km = 250

# Only acquired when an enabled detector declares this dependency.

[detectors.sky_crystals]
enabled = true # Coarse opportunity forecasts; crystal orientation/habit unknown.
interval_seconds = 1800
horizon_hours = 48
minimum_opportunity = 35
phenomena = ["halo22", "parhelia", "cza", "upper_tangent", "lower_tangent", "pillar", "lunar_halo", "diamond_dust"]
diamond_temperature_c = -20
[providers.swpc]
enabled = true
cache_seconds = 300
stale_after_minutes = 30
invalid_after_minutes = 60

# Shared modern GP/OMM; omitted Phase 3 detectors default disabled in old configs.

[providers.hrrr]
enabled = false # Optional .[hrrr] decoder; ~25 MB per selected six-hour run.
cache_seconds = 3600
max_run_age_hours = 8
levels = [20, 30]
forecast_hours = [3, 6]
max_download_mb = 32
[detectors.iss]
enabled = true
interval_seconds = 300
horizon_hours = 48
catalog_ids = [25544] # Other configured objects use the same pass geometry, not a brightness model.
minimum_altitude_deg = 20
maximum_sun_altitude_deg = -6

[detectors.iss_transits]
enabled = true # Experimental nominal center-track geometry; GP has no covariance.
interval_seconds = 300
horizon_hours = 24
bodies = ["Sun", "Moon"]
minimum_altitude_deg = 10

[providers.orbits]
enabled = true
catalog_ids = [25544] # Include every ID used by detectors.iss; at most 10.
cache_seconds = 7200 # CelesTrak GP updates only every two hours; never lower.
warning_hours = 24
stale_hours = 48
invalid_hours = 96
transit_current_hours = 12
transit_target_hours = 24

[detectors.adsb]
enabled = true
interval_seconds = 15
minimum_altitude_deg = 30
exit_altitude_deg = 20
projection_seconds = 180
absence_timeout_seconds = 180
maximum_range_km = 80
low_altitude_m = 2000
interesting_callsigns = [] # Exact callsigns, e.g. ["JBU123"]. No route inference.
interesting_types = [] # Provider type codes, e.g. ["A388"].
interesting_icao24 = []
emergency_squawks = true # Reported feed code, not an official emergency advisory.

[providers.adsb]
enabled = true
cache_seconds = 15
radius_nm = 60
stale_seconds = 30 # Actual seen_pos age, not HTTP age.
invalid_seconds = 90

[providers.enrichment]
enabled = false # Optional user-licensed records, never copied ADSBDB routes.
path = "enrichment.json" # Relative to this configuration; see README schema.
cache_seconds = 3600
max_age_hours = 24

[atmosphere]
enabled = true
cache_minutes = 60
max_stale_hours = 6
forecast_days = 10

# Direct ECCC RDPS seeing index, shared/cached; no Clear Dark Sky scraping.
# Set false to use only the explicitly uncalibrated wind fallback.
[atmosphere.canadian]
enabled = true
cache_minutes = 60
max_stale_hours = 6
max_run_age_hours = 18
max_grid_distance_km = 25

[notifications]
enabled = true
minimum_interest = 35
minimum_quality = 55
minimum_confidence = 0.3
exceptional_interest = 90
watch_lead_hours = 168
ready_lead_hours = 24
imminent_lead_minutes = 60

# Optional per-kind policy; same keys as notifications, e.g.:
# [notifications.overrides."sunset.opportunity"]
# minimum_quality = 70

[notifications.overrides."iss.pass"]
ready_lead_hours = 12
imminent_lead_minutes = 5

[notifications.overrides."spacecraft.pass"]
ready_lead_hours = 12
imminent_lead_minutes = 5

[notifications.overrides."aircraft.episode"]
minimum_interest = 70 # Limit routine traffic emails; configured interests still qualify.

[notifications.overrides."iss.transit.sun"]
ready_lead_hours = 12
imminent_lead_minutes = 5

[notifications.overrides."iss.transit.moon"]
ready_lead_hours = 12
imminent_lead_minutes = 5

[gmail]
enabled = false
destination = ""
client_secret = "secrets/client_secret.json"
token = "secrets/gmail_token.json"
base_url = "" # Optional explicit UI URL on an allowed host. Never inferred from bind_host.

[gmail.immediate]
event_types = ["*"] # All current/future families; explicit lists exclude future types.
enabled = true
minimum_interest = 85 # Additional email floor; local alert policy is unchanged.

[gmail.daily_digest]
event_types = ["*"]
enabled = true
time = "07:00" # Observer timezone, not machine timezone.
catch_up_hours = 4 # Also ends at local midnight; no old digest backlog.
max_events = 20

[gmail.weekly_digest]
event_types = ["*"]
enabled = true
weekday = "Sunday"
time = "18:00"
minimum_interest = 70
start_days_ahead = 7 # Strictly beyond this local-calendar offset from the slot.
end_days_ahead = 90
catch_up_hours = 24
max_events = 20

[map]
enabled = true
tiles_enabled = true # Viewed region goes to tile provider; false uses a blank base map.
tile_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
radius_km = 40
track_minutes = 10 # Transient bounded observations; restart clears trails.
max_aircraft = 150
max_points = 80
tile_attribution = "OpenStreetMap contributors"
