[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-sky-alert"
version = "0.1.0"
description = "Local modular sky predictions and notifications"
requires-python = ">=3.12"
dependencies = [
  "astronomy-engine>=2.1.19,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4", "httpx>=0.27,<1", "tzdata>=2025.1",
  "skyfield>=1.55,<2", "sgp4>=2.27,<3", "skyfield-data>=7,<8",
  "numpy>=1.26,<3",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
gmail = ["google-auth>=2.29,<3", "google-auth-oauthlib>=1.2,<2"]
dev = ["pytest>=8,<10"]
hrrr = ["eccodes>=2.43,<3"]
qa = ["playwright>=1.55,<2"]

[project.scripts]
all-sky-alert = "all_sky_alert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
all_sky_alert = ["templates/*.html", "static/*.css", "static/*.js", "static/vendor/leaflet/*", "static/vendor/leaflet/images/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
